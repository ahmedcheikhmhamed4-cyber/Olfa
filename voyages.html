<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vols</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="back">← Retour</a>
        <h1>✈️ Vols</h1>
        <p>Cherche et réserve ton vol</p>
    </header>

    <main>
        <form id="travelForm" class="travel-form">
            <div class="form-group">
                <label for="from">Ville de départ</label>
                <input type="text" id="from" placeholder="Ex: Tunis" required>
            </div>

            <div class="form-group">
                <label for="to">Ville de destination</label>
                <input type="text" id="to" placeholder="Ex: Paris" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="departDate">Date aller</label>
                    <input type="date" id="departDate" required>
                </div>
                <div class="form-group">
                    <label for="returnDate">Date retour</label>
                    <input type="date" id="returnDate">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="passengers">Passagers</label>
                    <input type="number" id="passengers" min="1" max="10" value="1" required>
                </div>
                <div class="form-group">
                    <label for="currency">Devise</label>
                    <select id="currency" class="form-select">
                        <option value="TND">TND (DT)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="USD">USD ($)</option>
                        <option value="AED">AED (د.إ)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn">Rechercher des vols</button>
        </form>

        <div id="results" class="results-container hidden"></div>
    </main>

    <script>
        const airlines = [
            { name: 'Tunisair', site: 'https://www.tunisair.com', color: '#003366' },
            { name: 'Nouvelair', site: 'https://www.nouvelair.com', color: '#009688' },
            { name: 'Air France', site: 'https://www.airfrance.fr', color: '#002157' },
            { name: 'Transavia', site: 'https://www.transavia.com', color: '#00aec7' },
            { name: 'Turkish Airlines', site: 'https://www.turkishairlines.com', color: '#e30a17' },
            { name: 'Qatar Airways', site: 'https://www.qatarairways.com', color: '#8a1538' },
            { name: 'Emirates', site: 'https://www.emirates.com', color: '#d71921' },
            { name: 'Ryanair', site: 'https://www.ryanair.com', color: '#073590' }
        ];

        const vehicleTypes = [
            { name: 'Citadine', seats: 4, icon: '🚗' },
            { name: 'Berline', seats: 5, icon: '🚙' },
            { name: 'SUV', seats: 5, icon: '🚙' },
            { name: 'Monospace', seats: 7, icon: '🚐' },
            { name: 'Minibus', seats: 9, icon: '🚐' }
        ];

        document.getElementById('travelForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const from = document.getElementById('from').value.trim();
            const to = document.getElementById('to').value.trim();
            const departDate = document.getElementById('departDate').value;
            const returnDate = document.getElementById('returnDate').value;
            const passengers = parseInt(document.getElementById('passengers').value);
            const currency = document.getElementById('currency').value;

            const container = document.getElementById('results');
            container.innerHTML = '';
            container.classList.remove('hidden');

            const dateLabel = new Date(departDate).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });

            // Google Flights — aller
            const gfQuery = `Vols de ${from} à ${to} le ${dateLabel} pour ${passengers} passagers`;
            const gfUrl = `https://www.google.com/travel/flights?q=${encodeURIComponent(gfQuery)}`;

            const gfSection = document.createElement('div');
            gfSection.style.textAlign = 'center';
            gfSection.style.margin = '2rem 0';
            gfSection.innerHTML = `
                <h2>Vols ${from} → ${to}</h2>
                <p style="color:#D6E8F5;margin:0.5rem 0 1rem">${dateLabel} · ${passengers} passager${passengers > 1 ? 's' : ''}</p>
                <a href="${gfUrl}" target="_blank" rel="noopener" class="btn btn-checkout" style="display:inline-block;width:auto">
                    🔍 Voir sur Google Flights
                </a>
            `;
            container.appendChild(gfSection);

            // Google Flights — retour
            if (returnDate) {
                const returnLabel = new Date(returnDate).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
                const returnGfQuery = `Vols de ${to} à ${from} le ${returnLabel} pour ${passengers} passagers`;
                const returnGfUrl = `https://www.google.com/travel/flights?q=${encodeURIComponent(returnGfQuery)}`;
                const returnSection = document.createElement('div');
                returnSection.style.textAlign = 'center';
                returnSection.style.margin = '2rem 0';
                returnSection.innerHTML = `
                    <h2>Vols ${to} → ${from}</h2>
                    <p style="color:#D6E8F5;margin:0.5rem 0 1rem">${returnLabel} · ${passengers} passager${passengers > 1 ? 's' : ''}</p>
                    <a href="${returnGfUrl}" target="_blank" rel="noopener" class="btn btn-checkout" style="display:inline-block;width:auto">
                        🔍 Voir sur Google Flights
                    </a>
                `;
                container.appendChild(returnSection);
            }

            // Compagnies aériennes
            const airlinesSection = document.createElement('div');
            airlinesSection.innerHTML = `
                <h2 style="text-align:center;margin-top:2rem">✈️ Compagnies aériennes</h2>
                <div class="extra-links" style="margin-top:1rem">
                    ${airlines.map(a => `
                        <a href="${a.site}" target="_blank" rel="noopener" class="extra-card">
                            <span class="extra-icon">✈️</span>
                            <span class="extra-name" style="color:${a.color}">${a.name}</span>
                            <span class="extra-desc">Voir sur leur site</span>
                        </a>
                    `).join('')}
                </div>
            `;
            container.appendChild(airlinesSection);

            // Hôtels
            const hotelsSection = document.createElement('div');
            hotelsSection.className = 'extra-section';
            hotelsSection.innerHTML = `
                <h2 style="margin-top:2rem">🏨 Hôtels & Appartements à ${to}</h2>
                <div class="extra-links">
                    <a href="https://www.booking.com/searchresults.html?ss=${encodeURIComponent(to)}" target="_blank" rel="noopener" class="extra-card">
                        <span class="extra-icon">🏨</span>
                        <span class="extra-name">Booking.com</span>
                        <span class="extra-desc">Hôtels, appartements, B&B</span>
                    </a>
                    <a href="https://www.airbnb.fr/s/${encodeURIComponent(to)}" target="_blank" rel="noopener" class="extra-card">
                        <span class="extra-icon">🏠</span>
                        <span class="extra-name">Airbnb</span>
                        <span class="extra-desc">Appartements et maisons</span>
                    </a>
                    <a href="https://www.hotels.com/search.do?destination=${encodeURIComponent(to)}" target="_blank" rel="noopener" class="extra-card">
                        <span class="extra-icon">🛏️</span>
                        <span class="extra-name">Hotels.com</span>
                        <span class="extra-desc">Hôtels partout dans le monde</span>
                    </a>
                </div>
            `;
            container.appendChild(hotelsSection);

            // Location de voiture
            const rentalUrl = `https://www.rentalcars.com/Search?pickup=${encodeURIComponent(to)}`;
            const filteredVehicles = vehicleTypes.filter(v => v.seats >= passengers);

            const carsSection = document.createElement('div');
            carsSection.innerHTML = `
                <h2 style="margin-top:2rem">🚗 Location de voiture à ${to}</h2>
                <div class="cars-grid">
                    ${filteredVehicles.map(v => `
                        <a href="${rentalUrl}" target="_blank" rel="noopener" class="car-card">
                            <div class="car-icon">${v.icon}</div>
                            <div class="car-info">
                                <div class="car-name">${v.name}</div>
                                <div class="car-type">${v.seats} places</div>
                            </div>
                            <div class="car-price">Voir prix →</div>
                        </a>
                    `).join('')}
                </div>
                <p class="cars-note">${passengers} passager${passengers > 1 ? 's' : ''} · véhicules avec ${passengers} place${passengers > 1 ? 's' : ''} minimum</p>
                <a href="${rentalUrl}" target="_blank" rel="noopener" class="btn btn-small">Voir plus sur Rentalcars →</a>
            `;
            container.appendChild(carsSection);

            container.scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
