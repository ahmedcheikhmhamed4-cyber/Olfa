                desc: 'Riz aux carottes et à l\'agneau.',
                cat: 'international',
                ingredients: ['300g riz', '400g agneau', '3 carottes', '2 oignons', 'Ail', 'Cumin'],
                instructions: 'Saisir la viande dans l\'huile. Ajouter oignons et carottes. Ajouter l\'eau et le cumin. Verser le riz sans mélanger. Cuire 20min à couvert.'
            },
            {
                name: 'Injera (Éthiopie)',
                desc: 'Galette fermentée au teff avec ragoûts épicés.',
                cat: 'international',
                ingredients: ['300g farine de teff', 'Eau', 'Berbéré', 'Viande ou légumes'],
                instructions: 'Mélanger la farine avec l\'eau. Laisser fermenter 3 jours. Cuire en crêpe épaisse. Préparer un ragoût épicé. Servir l\'injera avec le ragoût.'
            },
            {
                name: 'Jollof Rice (Nigeria)',
                desc: 'Riz rouge à la sauce tomate épicée.',
                cat: 'international',
                ingredients: ['300g riz', '400g tomates', '1 oignon', '2 poivrons', 'Thym', 'Piment'],
                instructions: 'Faire revenir l\'oignon et les poivrons. Ajouter les tomates et le riz. Cuire 20min. Servir avec du poulet grillé.'
            },
            {
                name: 'Thieboudienne (Sénégal)',
                desc: 'Riz au poisson et légumes.',
                cat: 'international',
                ingredients: ['300g riz', '400g poisson', '3 carottes', 'Chou', 'Tomate concentrée', 'Ail'],
                instructions: 'Cuire le poisson dans la sauce tomate. Ajouter les légumes et le riz. Cuire 20min. Servir le riz avec le poisson.'
            },
            {
                name: 'Koshari (Égypte)',
                desc: 'Riz, lentilles, pâtes sauce tomate et oignons frits.',
                cat: 'international',
                ingredients: ['200g riz', '200g lentilles', '200g pâtes', '400g tomates', '1 oignon', 'Cumin'],
                instructions: 'Cuire riz, lentilles et pâtes séparément. Préparer la sauce tomate. Frire l\'oignon. Mélanger et garnir.'
            },
            {
                name: 'Basbousa (Égypte)',
                desc: 'Gâteau de semoule au sirop et noix de coco.',
                cat: 'international',
                ingredients: ['300g semoule', '200g sucre', '100g noix de coco', '150g beurre', 'Yaourt'],
                instructions: 'Mélanger semoule, sucre, noix de coco, beurre et yaourt. Cuire 30min à 180°C. Verser le sirop chaud à la sortie.'
            },
            {
                name: 'Bobotie (Afrique du Sud)',
                desc: 'Gratin de viande hachée épicée aux œufs.',
                cat: 'international',
                ingredients: ['500g bœuf haché', '1 oignon', 'Pain', 'Lait', '2 œufs', 'Curry'],
                instructions: 'Faire revenir la viande avec curry. Ajouter le pain trempé. Verser dans un plat. Battre les œufs avec le lait et verser dessus. Cuire 30min à 180°C.'
            },
            {
                name: 'Pavlova (Australie/NZ)',
                desc: 'Meringue géante garnie de crème et fruits.',
                cat: 'international',
                ingredients: ['4 blancs', '200g sucre', '300ml crème', 'Fruits frais'],
                instructions: 'Monter les blancs avec le sucre. Cuire 1h à 120°C. Garnir de crème et fruits.'
            },
            {
                name: 'Beshbarmak (Kazakhstan)',
                desc: 'Viande bouillie sur des nouilles.',
                cat: 'international',
                ingredients: ['600g bœuf', '500g pâte', '1 oignon'],
                instructions: 'Cuire la viande 2h. Cuire les nouilles dans le bouillon. Disposer nouilles, viande et oignon. Verser du bouillon.'
            },
            {
                name: 'Khachapuri (Géorgie)',
                desc: 'Pain au fromage en bateau avec œuf.',
                cat: 'international',
                ingredients: ['500g farine', '200ml lait', '300g fromage', '1 œuf', 'Beurre'],
                instructions: 'Préparer la pâte. Étaler en bateau. Ajouter le fromage. Cuire 15min à 220°C. Ajouter l\'œuf et cuire 3min.'
            },
            {
                name: 'Dolma (Arménie)',
                desc: 'Feuilles de vigne farcies viande-riz.',
                cat: 'international',
                ingredients: ['300g feuilles de vigne', '400g viande hachée', '200g riz', '1 oignon'],
                instructions: 'Blanchir les feuilles. Mélanger viande, riz et oignon. Farcer et rouler. Cuire 45min. Servir avec yaourt.'
            },
            {
                name: 'Halo-Halo (Philippines)',
                desc: 'Dessert glacé aux fruits et haricots sucrés.',
                cat: 'international',
                ingredients: ['Glace pilée', 'Lait concentré', 'Haricots sucrés', 'Mangue', 'Leche flan'],
                instructions: 'Remplir un verre de glace. Ajouter tous les ingrédients. Arroser de lait concentré. Mélanger avant de déguster.'
            },
            {
                name: 'Cendol (Malaisie)',
                desc: 'Dessert glacé au lait de coco et gelée verte.',
                cat: 'international',
                ingredients: ['Glace pilée', 'Lait de coco', 'Gelée cendol', 'Sucre de palme'],
                instructions: 'Remplir un bol de glace. Ajouter la gelée et le sucre. Verser le lait de coco.'
            },
        ];

        const grid = document.getElementById('recipesGrid');
        const addBtn = document.getElementById('addBtn');
        const addForm = document.getElementById('addForm');
        const saveBtn = document.getElementById('saveBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        function renderSection(title, items) {
            const section = document.createElement('div');
            section.className = 'section-label';
            section.textContent = title;
            grid.appendChild(section);

            const wrapper = document.createElement('div');
            wrapper.className = 'grid';

            items.forEach(r => {
                const item = document.createElement('article');
                item.className = 'recipe-item';

                const header = document.createElement('div');
                header.className = 'recipe-header';
                header.innerHTML = `<h3>${r.name}</h3><p>${r.desc}</p>`;

                const content = document.createElement('div');
                content.className = 'recipe-content hidden';
                content.innerHTML = `
                    <div class="recipe-section">
                        <h4>Ingrédients</h4>
                        <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
                    </div>
                    <div class="recipe-section">
                        <h4>Préparation</h4>
                        <p>${r.instructions}</p>
                    </div>
                    <button class="btn-cart">Ajouter au panier</button>
                `;

                header.addEventListener('click', () => {
                    content.classList.toggle('hidden');
                });

                const cartBtn = content.querySelector('.btn-cart');
                cartBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    addToCart(r.name, r.ingredients);
                    cartBtn.textContent = '✓ Ajouté';
                    cartBtn.style.background = '#27ae60';
                    setTimeout(() => {
                        cartBtn.textContent = 'Ajouter au panier';
                        cartBtn.style.background = '';
                    }, 2000);
                });

                item.appendChild(header);
                item.appendChild(content);
                wrapper.appendChild(item);
            });

            grid.appendChild(wrapper);
        }

        function renderRecipes() {
            grid.innerHTML = '';
            const plats = recipes.filter(r => r.cat === 'plat');
            const desserts = recipes.filter(r => r.cat === 'dessert');
            const international = recipes.filter(r => r.cat === 'international');
            if (plats.length) renderSection('🍽️ Plats Tunisiens', plats);
            if (desserts.length) renderSection('🍰 Desserts Tunisiens', desserts);
            if (international.length) renderSection('🌍 International', international);
        }

        addBtn.addEventListener('click', () => addForm.classList.toggle('hidden'));

        cancelBtn.addEventListener('click', () => {
            addForm.classList.add('hidden');
            document.getElementById('newName').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newIngredients').value = '';
            document.getElementById('newInstructions').value = '';
        });

        saveBtn.addEventListener('click', () => {
            const name = document.getElementById('newName').value.trim();
            const desc = document.getElementById('newDesc').value.trim();
            const ingredients = document.getElementById('newIngredients').value.trim();
            const instructions = document.getElementById('newInstructions').value.trim();

            if (!name || !ingredients || !instructions) {
                alert('Remplis au moins le nom, les ingrédients et les instructions.');
                return;
            }

            recipes.push({
                name,
                desc: desc || 'Pas de description',
                ingredients: ingredients.split('\n').filter(i => i.trim()),
                instructions
            });

            renderRecipes();

            document.getElementById('newName').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newIngredients').value = '';
            document.getElementById('newInstructions').value = '';
            addForm.classList.add('hidden');
        });

        renderRecipes();
    </script>
</body>
</html>
