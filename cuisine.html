<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cusine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="cart.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="back">← Retour</a>
        <h1>🍽️ Cusine</h1>
        <p>Toutes les recettes et plats</p>
    </header>

    <main>
        <button class="btn btn-add" id="addBtn">+ Ajouter une recette</button>

        <div id="addForm" class="add-form hidden">
            <h3>Nouvelle recette</h3>
            <input type="text" id="newName" placeholder="Nom du plat" class="add-input">
            <textarea id="newDesc" placeholder="Description" class="add-input" rows="2"></textarea>
            <textarea id="newIngredients" placeholder="Ingrédients (un par ligne)" class="add-input" rows="4"></textarea>
            <textarea id="newInstructions" placeholder="Instructions de préparation" class="add-input" rows="4"></textarea>
            <div class="add-actions">
                <button class="btn btn-small" id="saveBtn">Ajouter</button>
                <button class="btn btn-small btn-cancel" id="cancelBtn">Annuler</button>
            </div>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchInput" class="filter-search" placeholder="🔍 Chercher une recette...">
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">Tout</button>
                <button class="filter-btn" data-filter="plat">🍽️ Plats</button>
                <button class="filter-btn" data-filter="entree">🥗 Entrées</button>
                <button class="filter-btn" data-filter="dessert">🍰 Desserts</button>
            </div>
        </div>
        <div class="grid" id="recipesGrid"></div>
    </main>

    <div id="mealModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>📅 Planifier un repas</h3>
            <p id="mealModalRecipe" class="modal-recipe-name"></p>
            <label>Date :</label>
            <input type="date" id="mealDate" class="meal-select">
            <label>Moment :</label>
            <select id="mealTime" class="meal-select"></select>
            <div class="modal-buttons">
                <button id="mealSaveBtn" class="btn">Ajouter</button>
                <button id="mealCancelBtn" class="btn btn-clear">Annuler</button>
            </div>
        </div>
    </div>

        const PEXELS_KEY = ''; // ← mets ta clé API Pexels ici (https://www.pexels.com/api/)

        const imageCache = JSON.parse(localStorage.getItem('recipeImages') || '{}');

        function saveImageCache() {
            localStorage.setItem('recipeImages', JSON.stringify(imageCache));
        }

        async function fetchRecipeImage(recipeName) {
            if (imageCache[recipeName]) return imageCache[recipeName];
            if (!PEXELS_KEY) return null;
            try {
                const res = await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(recipeName)}&per_page=1`, {
                    headers: { Authorization: PEXELS_KEY }
                });
                if (!res.ok) return null;
                const data = await res.json();
                const url = data.photos?.[0]?.src?.medium || null;
                imageCache[recipeName] = url;
                saveImageCache();
                return url;
            } catch {
                return null;
            }
        }

        const grid = document.getElementById('recipesGrid');
        const addBtn = document.getElementById('addBtn');
        const addForm = document.getElementById('addForm');
        const saveBtn = document.getElementById('saveBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        function renderSection(title, items) {
            const section = document.createElement('div');
            section.className = 'section-label';
            section.textContent = title;
            grid.appendChild(section);

            items.forEach(r => {
                const item = document.createElement('article');
                item.className = 'recipe-item';

                const header = document.createElement('div');
                header.className = 'recipe-header';
                const imgWrap = document.createElement('div');
                imgWrap.className = 'recipe-img-wrap';
                const img = document.createElement('img');
                img.className = 'recipe-img hidden';
                img.alt = `Photo de ${r.name}`;
                img.loading = 'lazy';
                img.dataset.recipeName = r.name;
                const placeholder = document.createElement('div');
                placeholder.className = 'recipe-img-placeholder';
                placeholder.textContent = '🍽️';
                imgWrap.appendChild(img);
                imgWrap.appendChild(placeholder);
                header.appendChild(imgWrap);
                const nameHeading = document.createElement('h3');
                nameHeading.textContent = r.name;
                header.appendChild(nameHeading);
                const descP = document.createElement('p');
                descP.textContent = r.desc;
                header.appendChild(descP);
                fetchRecipeImage(r.name).then(url => {
                    if (url) {
                        img.src = url;
                        img.classList.remove('hidden');
                        placeholder.classList.add('hidden');
                    }
                });
                const planBadge = document.createElement('button');
                planBadge.className = 'btn-plan-badge';
                planBadge.textContent = '📅';
                planBadge.title = 'Planifier ce repas';
                planBadge.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openMealPlanner(r.name);
                });
                header.appendChild(planBadge);

                const content = document.createElement('div');
                content.className = 'recipe-content hidden';
                content.innerHTML = `
                    <div class="recipe-section">
                        <h4>Ingrédients</h4>
                        <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
                    </div>
                    <div class="recipe-section">
                        <h4>Préparation</h4>
                        <p>${r.instructions}</p>
                    </div>
                    <button class="btn-cart">Ajouter au panier</button>
                `;

                header.addEventListener('click', () => {
                    content.classList.toggle('hidden');
                });

                const cartBtn = content.querySelector('.btn-cart');
                cartBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    addToCart(r.name, r.ingredients);
                    cartBtn.textContent = '✓ Ajouté';
                    cartBtn.style.background = '#1F618D';
                    setTimeout(() => {
                        cartBtn.textContent = 'Ajouter au panier';
                        cartBtn.style.background = '';
                    }, 2000);
                });

                item.appendChild(header);
                item.appendChild(content);
                grid.appendChild(item);
            });
        }

        function renderRecipes() {
            grid.innerHTML = '';
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filter = document.querySelector('.filter-btn.active').dataset.filter;

            let filtered = recipes;
            if (filter !== 'all') {
                filtered = filtered.filter(r => r.cat === filter);
            }
            if (query) {
                filtered = filtered.filter(r => r.name.toLowerCase().includes(query));
            }

            const plats = filtered.filter(r => r.cat === 'plat');
            const entrees = filtered.filter(r => r.cat === 'entree');
            const desserts = filtered.filter(r => r.cat === 'dessert');
            if (plats.length) renderSection('🍽️ Plats', plats);
            if (entrees.length) renderSection('🥗 Entrées', entrees);
            if (desserts.length) renderSection('🍰 Desserts', desserts);
            if (!filtered.length) {
                grid.innerHTML = '<p class="empty-msg">Aucune recette trouvée.</p>';
            }
        }

        document.getElementById('searchInput').addEventListener('input', renderRecipes);
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderRecipes();
            });
        });

        addBtn.addEventListener('click', () => addForm.classList.toggle('hidden'));

        cancelBtn.addEventListener('click', () => {
            addForm.classList.add('hidden');
            document.getElementById('newName').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newIngredients').value = '';
            document.getElementById('newInstructions').value = '';
        });

        saveBtn.addEventListener('click', () => {
            const name = document.getElementById('newName').value.trim();
            const desc = document.getElementById('newDesc').value.trim();
            const ingredients = document.getElementById('newIngredients').value.trim();
            const instructions = document.getElementById('newInstructions').value.trim();

            if (!name || !ingredients || !instructions) {
                alert('Remplis au moins le nom, les ingrédients et les instructions.');
                return;
            }

            recipes.push({
                name,
                desc: desc || 'Pas de description',
                ingredients: ingredients.split('\n').filter(i => i.trim()),
                instructions
            });

            renderRecipes();

            document.getElementById('newName').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newIngredients').value = '';
            document.getElementById('newInstructions').value = '';
            addForm.classList.add('hidden');
        });

        renderRecipes();

        let plannerRecipeName = '';

        function openMealPlanner(name) {
            plannerRecipeName = name;
            document.getElementById('mealModalRecipe').textContent = name;
            document.getElementById('mealModal').classList.remove('hidden');
        }

        const dateInput = document.getElementById('mealDate');
        dateInput.value = todayStr();

        const timeSelect = document.getElementById('mealTime');
        mealTimes.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t;
            opt.textContent = t;
            timeSelect.appendChild(opt);
        });

        document.getElementById('mealSaveBtn').addEventListener('click', () => {
            const date = dateInput.value;
            const time = timeSelect.value;
            addToMealPlan(plannerRecipeName, date, time);
            document.getElementById('mealModal').classList.add('hidden');
            alert(`✓ "${plannerRecipeName}" ajouté au ${formatDate(date)} (${time})`);
        });

        document.getElementById('mealCancelBtn').addEventListener('click', () => {
            document.getElementById('mealModal').classList.add('hidden');
        });

        document.getElementById('mealModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('mealModal').classList.add('hidden');
            }
        });
    </script>
