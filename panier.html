<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier</title>
    <link rel="stylesheet" href="style.css">
    <script src="cart.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="back">← Retour</a>
        <h1>🛒 Mon Panier</h1>
        <p>Ingrédients ajoutés depuis les recettes</p>
    </header>

    <main>
        <div id="cartContent">
            <div id="recipesSection"></div>
            <div id="ingredientsSection"></div>
        </div>
    </main>

    <script>
        function renderPanier() {
            const cart = getCart();
            const recipesDiv = document.getElementById('recipesSection');
            const ingredientsDiv = document.getElementById('ingredientsSection');

            if (cart.length === 0) {
                recipesDiv.innerHTML = '<p class="empty-msg">Ton panier est vide. Ajoute des ingrédients depuis les recettes !</p>';
                ingredientsDiv.innerHTML = '';
                return;
            }

            recipesDiv.innerHTML = '<h2>📋 Recettes dans le panier</h2>';
            const recipeList = document.createElement('div');
            recipeList.className = 'cart-recipes';

            cart.forEach((entry, idx) => {
                const card = document.createElement('div');
                card.className = 'cart-recipe-card';
                card.innerHTML = `
                    <div class="cart-recipe-info">
                        <strong>${entry.recipeName}</strong>
                        <span class="cart-recipe-count">${entry.ingredients.length} ingrédients</span>
                    </div>
                    <button class="btn-remove" data-index="${idx}">Supprimer</button>
                `;
                recipeList.appendChild(card);
            });

            recipesDiv.appendChild(recipeList);

            const allIngs = getAllIngredients();
            ingredientsDiv.innerHTML = '<h2>🏪 Tous les ingrédients — Prix Union Coop (AED)</h2>';

            const table = document.createElement('table');
            table.className = 'price-table';
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Ingrédient</th>
                        <th>Produit suggéré</th>
                        <th>Prix Union Coop</th>
                    </tr>
                </thead>
                <tbody></tbody>
            `;
            const tbody = table.querySelector('tbody');

            allIngs.forEach(ing => {
                const match = findPrice(ing.text);
                const tr = document.createElement('tr');
                if (match) {
                    tr.innerHTML = `
                        <td>${ing.text}</td>
                        <td>${match.name} (${match.unit})</td>
                        <td class="price-cell">${match.price.toFixed(2)} AED</td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td>${ing.text}</td>
                        <td class="no-match">—</td>
                        <td class="price-cell">— AED</td>
                    `;
                }
                tbody.appendChild(tr);
            });

            const total = allIngs.reduce((sum, ing) => {
                const match = findPrice(ing.text);
                return sum + (match ? match.price : 0);
            }, 0);

            const totalRow = document.createElement('tr');
            totalRow.className = 'total-row';
            totalRow.innerHTML = `
                <td colspan="2"><strong>Total estimé</strong></td>
                        <td class="price-cell"><strong>${total.toFixed(2)} AED</strong></td>
            `;
            tbody.appendChild(totalRow);

            ingredientsDiv.appendChild(table);

            const checkoutDiv = document.createElement('div');
            checkoutDiv.className = 'checkout-section';

            const btnRow = document.createElement('div');
            btnRow.className = 'checkout-buttons';
            
            const copyBtn = document.createElement('button');
            copyBtn.className = 'btn btn-secondary';
            copyBtn.textContent = '📋 Copier la liste';
            copyBtn.addEventListener('click', () => {
                const text = allIngs.map(ing => '☐ ' + ing.text).join('\n');
                navigator.clipboard.writeText(text).then(() => {
                    copyBtn.textContent = '✓ Copiée !';
                    setTimeout(() => { copyBtn.textContent = '📋 Copier la liste'; }, 2000);
                });
            });
            btnRow.appendChild(copyBtn);

            const printBtn = document.createElement('button');
            printBtn.className = 'btn btn-secondary';
            printBtn.textContent = '🖨️ Imprimer';
            printBtn.addEventListener('click', () => window.print());
            btnRow.appendChild(printBtn);

            checkoutDiv.appendChild(btnRow);

            const searchNote = document.createElement('p');
            searchNote.className = 'checkout-note';
            searchNote.textContent = 'Chaque ingrédient sur Union Coop :';
            checkoutDiv.appendChild(searchNote);

            const searchLinks = document.createElement('div');
            searchLinks.className = 'search-links';
            allIngs.forEach(ing => {
                const link = document.createElement('a');
                link.className = 'search-link';
                link.href = 'https://www.unioncoop.ae/catalogsearch/result/?q=' + encodeURIComponent(ing.text);
                link.target = '_blank';
                link.textContent = ing.text;
                searchLinks.appendChild(link);
            });
            checkoutDiv.appendChild(searchLinks);
            ingredientsDiv.appendChild(checkoutDiv);

            const clearDiv = document.createElement('div');
            clearDiv.style.textAlign = 'center';
            clearDiv.style.marginTop = '1.5rem';
            const clearBtn = document.createElement('button');
            clearBtn.className = 'btn btn-clear';
            clearBtn.textContent = 'Vider le panier';
            clearBtn.addEventListener('click', () => {
                if (confirm('Vider tout le panier ?')) {
                    clearCart();
                    renderPanier();
                }
            });
            clearDiv.appendChild(clearBtn);
            ingredientsDiv.appendChild(clearDiv);

            document.querySelectorAll('.btn-remove').forEach(btn => {
                btn.addEventListener('click', () => {
                    removeFromCart(parseInt(btn.dataset.index));
                    renderPanier();
                });
            });
        }

        document.addEventListener('DOMContentLoaded', renderPanier);
    </script>
</body>
</html>
