<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gâteaux</title>
    <link rel="stylesheet" href="style.css">
    <script src="cart.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="back">← Retour</a>
        <h1>🎂 Gâteaux</h1>
        <p>Les 100 gâteaux les plus connus du monde</p>
        <div class="diff-legend">
            <span class="legend-dot hard"></span> Difficile
            <span class="legend-dot medium" style="margin-left:1rem"></span> Moyen
            <span class="legend-dot easy" style="margin-left:1rem"></span> Facile
        </div>
    </header>

    <main>
        <button class="btn btn-add" id="addBtn">+ Ajouter un gâteau</button>

        <div id="addForm" class="add-form hidden">
            <h3>Nouveau gâteau</h3>
            <select id="newDiff" class="add-input">
                <option value="easy">Facile</option>
                <option value="medium">Moyen</option>
                <option value="hard">Difficile</option>
            </select>
            <input type="text" id="newName" placeholder="Nom du gâteau" class="add-input">
            <textarea id="newDesc" placeholder="Description" class="add-input" rows="2"></textarea>
            <textarea id="newIngredients" placeholder="Ingrédients (un par ligne)" class="add-input" rows="4"></textarea>
            <textarea id="newInstructions" placeholder="Instructions" class="add-input" rows="4"></textarea>
            <div class="add-actions">
                <button class="btn btn-small" id="saveBtn">Ajouter</button>
                <button class="btn btn-small btn-cancel" id="cancelBtn">Annuler</button>
            </div>
        </div>

        <div class="grid" id="recipesGrid"></div>
    </main>

        const diffOrder = { hard: 0, medium: 1, easy: 2 };

        function renderRecipes() {
            grid.innerHTML = '';
            const sorted = [...recipes].sort((a, b) => diffOrder[a.diff] - diffOrder[b.diff]);

            sorted.forEach(r => {
                const item = document.createElement('article');
                item.className = 'recipe-item diff-' + r.diff;

                const badges = { hard: '🔴 Difficile', medium: '🟠 Moyen', easy: '🟢 Facile' };

                const header = document.createElement('div');
                header.className = 'recipe-header';
                header.innerHTML = `<h3>${r.name} <span class="diff-badge ${r.diff}">${badges[r.diff]}</span></h3><p>${r.desc}</p>`;

                const content = document.createElement('div');
                content.className = 'recipe-content hidden';
                content.innerHTML = `
                    <div class="recipe-section">
                        <h4>Ingrédients</h4>
                        <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
                    </div>
                    <div class="recipe-section">
                        <h4>Préparation</h4>
                        <p>${r.instructions}</p>
                    </div>
                    <button class="btn-cart">Ajouter au panier</button>
                `;

                header.addEventListener('click', () => {
                    content.classList.toggle('hidden');
                });

                const cartBtn = content.querySelector('.btn-cart');
                cartBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    addToCart(r.name, r.ingredients);
                    cartBtn.textContent = '✓ Ajouté';
                    cartBtn.style.background = '#27ae60';
                    setTimeout(() => {
                        cartBtn.textContent = 'Ajouter au panier';
                        cartBtn.style.background = '';
                    }, 2000);
                });

                item.appendChild(header);
                item.appendChild(content);
                grid.appendChild(item);
            });
        }

        addBtn.addEventListener('click', () => addForm.classList.toggle('hidden'));

        cancelBtn.addEventListener('click', () => {
            addForm.classList.add('hidden');
            document.getElementById('newName').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newIngredients').value = '';
            document.getElementById('newInstructions').value = '';
        });

        saveBtn.addEventListener('click', () => {
            const diff = document.getElementById('newDiff').value;
            const name = document.getElementById('newName').value.trim();
            const desc = document.getElementById('newDesc').value.trim();
            const ingredients = document.getElementById('newIngredients').value.trim();
            const instructions = document.getElementById('newInstructions').value.trim();

            if (!name || !ingredients || !instructions) {
                alert('Remplis au moins le nom, les ingrédients et les instructions.');
                return;
            }

            recipes.push({
                name,
                desc: desc || 'Pas de description',
                diff,
                ingredients: ingredients.split('\n').filter(i => i.trim()),
                instructions
            });

            renderRecipes();

            document.getElementById('newName').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newIngredients').value = '';
            document.getElementById('newInstructions').value = '';
            addForm.classList.add('hidden');
        });

        renderRecipes();
